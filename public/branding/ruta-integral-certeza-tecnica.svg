<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#06264a"/><stop offset=".55" stop-color="#0d5798"/><stop offset="1" stop-color="#061c36"/></linearGradient>
<linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff8c00"/><stop offset="1" stop-color="#e85d00"/></linearGradient>
<linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1689ff"/><stop offset="1" stop-color="#0757ad"/></linearGradient>
<linearGradient id="green" x1="0" x2="1"><stop stop-color="#75bf29"/><stop offset="1" stop-color="#3c8218"/></linearGradient>
<linearGradient id="purple" x1="0" x2="1"><stop stop-color="#8546dd"/><stop offset="1" stop-color="#5426a3"/></linearGradient>
<filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".22"/></filter>
<style>.t{font-family:Arial,Helvetica,sans-serif}.w{fill:#fff}.n{fill:#082a54}.g{fill:#f5b321}.b{font-weight:900}.sb{font-weight:700}.item{font-size:16px}</style>
</defs>
<rect width="1672" height="941" fill="#edf4fb"/>
<rect width="1672" height="204" fill="url(#bg)"/>
<image href="/branding/nosotros-plataforma-aprobada.png" x="720" y="0" width="640" height="204" preserveAspectRatio="xMidYMid slice" opacity=".38"/>
<text class="t w b" x="30" y="70" font-size="62">LA RUTA INTEGRAL</text>
<text class="t g b" x="30" y="128" font-size="47">DE TU PROYECTO CON CERTEZA TÉCNICA</text>
<text class="t w sb" x="34" y="164" font-size="23">Nuestras 4 áreas de servicio se conectan para llevar tu proyecto</text>
<text class="t w sb" x="34" y="192" font-size="23">desde la estrategia hasta el cierre, con control, calidad y resultados.</text>
<image href="/branding/logo-autorizado.png" x="1185" y="-8" width="235" height="235" preserveAspectRatio="xMidYMid meet"/>
<g class="t w b" font-size="18"><text x="1430" y="57">MÁS PLANEACIÓN</text><text x="1430" y="83">MÁS CONTROL</text><text x="1430" y="109">MÁS CUMPLIMIENTO</text><text x="1430" y="135">MÁS CALIDAD</text><text x="1430" y="161">MÁS VALOR</text></g>
<line x1="1428" y1="177" x2="1542" y2="165" stroke="#ff9800" stroke-width="6"/>

<!-- DIRECCIÓN Y DESARROLLO -->
<g filter="url(#s)"><rect x="18" y="220" width="505" height="312" rx="16" fill="#fff" stroke="#e0e8ef"/><rect x="18" y="220" width="505" height="70" rx="16" fill="url(#orange)"/>
<text class="t w b" x="48" y="270" font-size="40">1</text><text class="t w b" x="110" y="254" font-size="27">DIRECCIÓN Y DESARROLLO</text><text class="t w sb" x="110" y="279" font-size="18">Define el rumbo y genera valor.</text>
<g class="t n item"><text x="54" y="322">• Evaluación técnico-económica</text><text x="54" y="347">• Planeación integral del proyecto</text><text x="54" y="372">• Coordinación multidisciplinaria</text><text x="54" y="397">• Ingeniería de valor</text><text x="54" y="422">• Estrategia de contratación y ejecución</text><text x="54" y="447">• Dirección integral del proyecto</text><text x="54" y="472">• Gestión de riesgos y toma de decisiones</text><text x="54" y="497">• Capacitación técnica y desarrollo de competencias profesionales</text><text x="54" y="522">• Consultoría</text></g>
<rect x="36" y="538" width="469" height="56" rx="12" fill="#fff1dd"/><text class="t b" x="62" y="562" font-size="17" fill="#d65c00">RESULTADO:</text><text class="t n sb" x="160" y="562" font-size="16">Proyectos alineados a la estrategia,</text><text class="t n sb" x="160" y="583" font-size="16">con liderazgo y mayor certeza al cierre.</text></g>

<!-- PLANEACIÓN Y ADMINISTRACIÓN -->
<g filter="url(#s)"><rect x="1148" y="220" width="506" height="312" rx="16" fill="#fff" stroke="#dfe9f3"/><rect x="1148" y="220" width="506" height="70" rx="16" fill="url(#blue)"/>
<text class="t w b" x="1178" y="270" font-size="40">2</text><text class="t w b" x="1240" y="254" font-size="25">PLANEACIÓN Y ADMINISTRACIÓN</text><text class="t w sb" x="1240" y="279" font-size="18">Organiza recursos y procesos para el control.</text>
<g class="t n item"><text x="1192" y="322">• Planeación integral del proyecto</text><text x="1192" y="352">• Programación y control de avance</text><text x="1192" y="382">• Administración financiera y flujo de obra</text><text x="1192" y="412">• Administración de contratos, compras,</text><text x="1210" y="435">subcontratos y cambios</text><text x="1192" y="465">• Control documental y administrativo</text><text x="1192" y="495">• Control integral mediante Certeza Project Manager</text></g>
<rect x="1166" y="538" width="470" height="56" rx="12" fill="#eaf5ff"/><text class="t b" x="1190" y="562" font-size="17" fill="#0757ad">RESULTADO:</text><text class="t n sb" x="1290" y="562" font-size="16">Proyectos mejor organizados, con procesos</text><text class="t n sb" x="1290" y="583" font-size="16">claros y control integral.</text></g>

<!-- SUPERVISIÓN Y AUDITORÍA -->
<g filter="url(#s)"><rect x="18" y="550" width="505" height="298" rx="16" fill="#fff" stroke="#e0e8ef"/><rect x="18" y="550" width="505" height="70" rx="16" fill="url(#purple)"/>
<text class="t w b" x="48" y="600" font-size="40">4</text><text class="t w b" x="110" y="584" font-size="27">SUPERVISIÓN Y AUDITORÍA</text><text class="t w sb" x="110" y="609" font-size="18">Verifica, asegura y da cumplimiento.</text>
<g class="t n item"><text x="54" y="649">• Supervisión técnica de obra</text><text x="54" y="674">• Supervisión de calidad</text><text x="54" y="699">• Auditoría de obra</text><text x="54" y="724">• Auditoría de estimaciones y generadores</text><text x="54" y="749">• Auditoría de costos</text><text x="54" y="774">• Auditoría de avance físico-financiero</text><text x="54" y="799">• Auditoría contractual</text><text x="54" y="824">• Auditoría documental</text><text x="54" y="849">• Diagnóstico de obra en proceso</text><text x="54" y="874">• Cierre y recepción de obra</text></g>
<rect x="36" y="858" width="469" height="62" rx="12" fill="#f2ebff"/><text class="t b" x="62" y="882" font-size="17" fill="#6b2bbd">RESULTADO:</text><text class="t n sb" x="160" y="882" font-size="15">Obras con calidad, cumplimiento normativo</text><text class="t n sb" x="160" y="902" font-size="15">y mayor certeza en el logro de objetivos.</text></g>

<!-- PRESUPUESTOS Y COSTOS -->
<g filter="url(#s)"><rect x="1148" y="550" width="506" height="298" rx="16" fill="#fff" stroke="#dfe9f3"/><rect x="1148" y="550" width="506" height="70" rx="16" fill="url(#green)"/>
<text class="t w b" x="1178" y="600" font-size="40">3</text><text class="t w b" x="1240" y="584" font-size="27">PRESUPUESTOS Y COSTOS</text><text class="t w sb" x="1240" y="609" font-size="18">Determina, analiza y controla el costo.</text>
<g class="t n item"><text x="1192" y="649">• Generadores y cuantificaciones</text><text x="1192" y="674">• Catálogo de conceptos</text><text x="1192" y="699">• Análisis de precios unitarios y tarjetas</text><text x="1192" y="724">• Presupuestos y explosión de insumos</text><text x="1192" y="749">• Revisión y auditoría de presupuestos</text><text x="1192" y="774">• Viabilidad y presupuestos paramétricos</text><text x="1192" y="799">• Comparativa de presupuestos</text><text x="1192" y="824">• Ingeniería de valor</text><text x="1192" y="849">• Análisis de variaciones</text></g>
<rect x="1166" y="858" width="470" height="62" rx="12" fill="#eaf7df"/><text class="t b" x="1190" y="882" font-size="17" fill="#3c8218">RESULTADO:</text><text class="t n sb" x="1290" y="882" font-size="15">Presupuestos realistas y optimizados,</text><text class="t n sb" x="1290" y="902" font-size="15">control de costos y mayor rentabilidad.</text></g>

<!-- RUTA CENTRAL -->
<g filter="url(#s)"><circle cx="836" cy="540" r="286" fill="#f7fbff" stroke="#d8e6f4" stroke-width="8"/><image href="/branding/nosotros-plataforma-aprobada.png" x="570" y="300" width="532" height="480" preserveAspectRatio="xMidYMid slice" opacity=".22"/>
<path d="M700 350 C785 295 880 295 970 350" fill="none" stroke="#ff8500" stroke-width="22"/><polygon points="966,330 1008,352 968,372" fill="#ff8500"/><path d="M1020 430 C1075 505 1075 590 1025 665" fill="none" stroke="#1689ff" stroke-width="22"/><polygon points="1013,660 1024,701 1051,666" fill="#1689ff"/><path d="M968 766 C875 824 790 824 700 770" fill="none" stroke="#5ca71e" stroke-width="22"/><polygon points="707,749 665,774 706,792" fill="#5ca71e"/><path d="M650 675 C600 594 602 505 650 430" fill="none" stroke="#7137c3" stroke-width="22"/><polygon points="630,437 654,397 672,439" fill="#7137c3"/>
<circle cx="836" cy="540" r="93" fill="#fff" stroke="#dce8f2" stroke-width="5"/><text class="t n b" x="836" y="532" text-anchor="middle" font-size="24">TU PROYECTO</text><text class="t n b" x="836" y="562" text-anchor="middle" font-size="20">EN EL CENTRO</text>
<circle cx="665" cy="402" r="101" fill="url(#orange)" stroke="#fff" stroke-width="8"/><text class="t w b" x="665" y="392" text-anchor="middle" font-size="23">DIRECCIÓN</text><text class="t w b" x="665" y="420" text-anchor="middle" font-size="23">Y DESARROLLO</text><text class="t w sb" x="665" y="449" text-anchor="middle" font-size="15">Define, alinea y lidera.</text>
<circle cx="1007" cy="402" r="101" fill="url(#blue)" stroke="#fff" stroke-width="8"/><text class="t w b" x="1007" y="392" text-anchor="middle" font-size="23">PLANEACIÓN Y</text><text class="t w b" x="1007" y="420" text-anchor="middle" font-size="23">ADMINISTRACIÓN</text><text class="t w sb" x="1007" y="449" text-anchor="middle" font-size="15">Organiza, programa y controla.</text>
<circle cx="1007" cy="704" r="101" fill="url(#green)" stroke="#fff" stroke-width="8"/><text class="t w b" x="1007" y="694" text-anchor="middle" font-size="23">PRESUPUESTOS</text><text class="t w b" x="1007" y="722" text-anchor="middle" font-size="23">Y COSTOS</text><text class="t w sb" x="1007" y="751" text-anchor="middle" font-size="15">Cuantifica, analiza y optimiza.</text>
<circle cx="665" cy="704" r="101" fill="url(#purple)" stroke="#fff" stroke-width="8"/><text class="t w b" x="665" y="694" text-anchor="middle" font-size="23">SUPERVISIÓN</text><text class="t w b" x="665" y="722" text-anchor="middle" font-size="23">Y AUDITORÍA</text><text class="t w sb" x="665" y="751" text-anchor="middle" font-size="15">Verifica y asegura.</text></g>

<rect x="540" y="224" width="250" height="52" rx="24" fill="url(#orange)"/><text class="t w b" x="665" y="248" text-anchor="middle" font-size="18">ESTRATEGIA</text><text class="t w sb" x="665" y="268" text-anchor="middle" font-size="14">Qué queremos lograr y por qué.</text>
<rect x="882" y="224" width="250" height="52" rx="24" fill="url(#blue)"/><text class="t w b" x="1007" y="248" text-anchor="middle" font-size="18">PLANEACIÓN</text><text class="t w sb" x="1007" y="268" text-anchor="middle" font-size="14">Cómo lo haremos, con qué recursos y en qué tiempo.</text>
<rect x="540" y="805" width="250" height="52" rx="24" fill="url(#purple)"/><text class="t w b" x="665" y="829" text-anchor="middle" font-size="18">EJECUCIÓN</text><text class="t w sb" x="665" y="849" text-anchor="middle" font-size="14">Hacemos que suceda con calidad y control.</text>
<rect x="882" y="805" width="250" height="52" rx="24" fill="url(#green)"/><text class="t w b" x="1007" y="829" text-anchor="middle" font-size="18">CONTROL Y MEJORA</text><text class="t w sb" x="1007" y="849" text-anchor="middle" font-size="14">Medimos, corregimos y generamos valor.</text>

<rect x="0" y="862" width="1672" height="79" fill="#06264a"/><rect x="0" y="862" width="342" height="79" fill="#ff8500"/>
<text class="t w b" x="34" y="892" font-size="22">UN PROCESO CONECTADO,</text><text class="t w b" x="34" y="917" font-size="22">MEJORES RESULTADOS</text>
<g class="t w sb" font-size="15"><text x="384" y="892">1  De la estrategia a la planeación.</text><text x="612" y="892">2  De la planeación a la presupuestación.</text><text x="886" y="892">3  De la presupuestación a la ejecución.</text><text x="1150" y="892">4  De la ejecución a la verificación.</text></g>
<text class="t g b" x="1430" y="886" font-size="16">De un proyecto aislado</text><text class="t g b" x="1430" y="906" font-size="16">a un resultado integral</text><text class="t w b" x="1430" y="926" font-size="16">con certeza técnica.</text>
</svg>
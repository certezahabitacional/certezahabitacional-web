name: Ajusta revision final
on:
  push:
    branches:
      - codex/revision-final-cliente
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/revision-final-cliente
          fetch-depth: 0
      - name: Aplicar ajustes puntuales
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'No se encontro patron en {path}: {old[:80]}')
              p.write_text(s.replace(old, new))

          replace('app/panel/inspecciones/[id]/areas/page.tsx',
                  'href={`/panel/inspecciones/${id}/flujo`} className="text-sm font-black text-cyan-300">← Flujo de campo</Link>',
                  'href={`/panel/inspecciones/${id}`} className="text-sm font-black text-cyan-300">← Expediente</Link>')
          replace('app/panel/inspecciones/[id]/areas/page.tsx',
                  'const minimo = fachada ? 4 : 1;',
                  'const minimo = 1;')
          replace('app/panel/inspecciones/[id]/cierre-v1/actions.ts',
                  'if (v.fachadaFotos < 4) return "La fachada principal requiere 4 fotografías antes de terminar la visita.";',
                  'if (v.fachadaFotos !== 1) return "La fachada principal debe conservar exactamente una fotografía definitiva elegida en la revisión inicial.";')
          replace('app/panel/inspecciones/[id]/cierre-v1/actions.ts',
                  'revalidatePath(`/panel/inspecciones/${inspeccionId}/flujo`);',
                  'revalidatePath(`/panel/inspecciones/${inspeccionId}/areas`);')
          replace('app/panel/inspecciones/nueva/actions.ts',
                  'estado:iniciarAhora?EstadoInspeccion.EN_PROCESO:EstadoInspeccion.PROGRAMADA',
                  'estado:EstadoInspeccion.PROGRAMADA')
          replace('app/panel/inspecciones/nueva/actions.ts',
                  '${iniciarAhora?"agendó e inició":"agendó"}',
                  '${iniciarAhora?"agendó y abrió revisión final":"agendó"}')
          replace('app/panel/inspecciones/nueva/actions.ts',
                  'if(iniciarAhora)redirect(inspeccion.numeroInspeccion===1?`/panel/inspecciones/${inspeccion.id}/flujo`:`/panel/inspecciones/${inspeccion.id}/captura`);',
                  'if(iniciarAhora)redirect(`/panel/inspecciones/${inspeccion.id}/revision-inicial`);')
          PY
          rm .github/workflows/ajusta-revision-final.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/ajusta-revision-final.yml
          git commit -m "Alinea revision inicial con captura y cierre V1"
          git push origin HEAD:codex/revision-final-cliente

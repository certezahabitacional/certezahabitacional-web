name: V2 V3 - aceptacion integral

on:
  push:
    branches:
      - codex/visitas-importe-contratado
    paths:
      - 'app/panel/cotizaciones/**'
      - 'app/panel/caja/**'
      - 'app/panel/agenda/**'
      - 'app/panel/inspecciones/**'
      - 'lib/visitas-*.ts'
      - 'lib/caja-*.ts'
      - 'tests/**'
      - 'supabase/migrations/20261020192609_visitas_cotizacion_importe.sql'
      - '.github/workflows/visitas-aceptacion-integral.yml'

permissions:
  contents: read

jobs:
  datos-v2-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visitas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/visitas_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test?schema=public
      PGPASSWORD: postgres
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Preparar copia efimera autorizada
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visitas-ci/lib" "$RUNNER_TEMP/visitas-ci/tests/fixtures" "$RUNNER_TEMP/visitas-ci/prisma"
          cp lib/visitas-contrato.ts lib/visitas-cotizacion.ts lib/caja-finanzas.ts lib/caja-operaciones.ts "$RUNNER_TEMP/visitas-ci/lib/"
          cp tests/visitas-contrato.test.cjs tests/visitas-integracion.test.cjs tests/visitas-caja.test.cjs tests/visitas-vinculo.test.cjs "$RUNNER_TEMP/visitas-ci/tests/"
          cp tests/fixtures/visitas-cotizacion.sql "$RUNNER_TEMP/visitas-ci/tests/fixtures/"
          cp prisma/schema.prisma "$RUNNER_TEMP/visitas-ci/prisma/"
          cp tests/visitas-package.json "$RUNNER_TEMP/visitas-ci/package.json"
          node tests/visitas-preparar-esquema.cjs "$RUNNER_TEMP/visitas-ci/prisma/schema.prisma"
          cd "$RUNNER_TEMP/visitas-ci"
          npm install --ignore-scripts --no-audit --no-fund
          npx prisma generate

      - name: Preparar base efimera V2 V3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visitas-ci"
          psql -h localhost -U postgres -d visitas_test -v ON_ERROR_STOP=1 -c 'CREATE SEQUENCE "Cliente_folio_seq";'
          npx prisma db push --skip-generate
          psql -h localhost -U postgres -d visitas_test -v ON_ERROR_STOP=1 -f tests/fixtures/visitas-cotizacion.sql

      - name: Compilar logica de visitas y Caja
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visitas-ci"
          npx tsc lib/visitas-contrato.ts lib/visitas-cotizacion.ts lib/caja-finanzas.ts lib/caja-operaciones.ts --outDir .test-visitas --target es2020 --module commonjs --moduleResolution node --strict --skipLibCheck

      - name: Contratacion V2 V3 V4 y finanzas independientes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/visitas-ci"
          node --test tests/visitas-contrato.test.cjs tests/visitas-integracion.test.cjs tests/visitas-caja.test.cjs tests/visitas-vinculo.test.cjs

      - name: Probar migracion final en base efimera limpia
        run: |
          set -euo pipefail
          createdb -h localhost -U postgres visitas_migracion
          psql -h localhost -U postgres -d visitas_migracion -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon, authenticated;
          CREATE SEQUENCE "Cliente_folio_seq";
          SQL

          cd "$RUNNER_TEMP/visitas-ci"
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/visitas_migracion?schema=public"           DIRECT_URL="postgresql://postgres:postgres@localhost:5432/visitas_migracion?schema=public"             npx prisma db push --skip-generate

          psql -h localhost -U postgres -d visitas_migracion -v ON_ERROR_STOP=1             -f "$GITHUB_WORKSPACE/supabase/migrations/20261020192609_visitas_cotizacion_importe.sql"

          psql -h localhost -U postgres -d visitas_migracion -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public."CotizacionVisita"'::regclass) THEN
              RAISE EXCEPTION 'RLS no quedo habilitado en CotizacionVisita';
            END IF;
            IF has_table_privilege('anon', 'public."CotizacionVisita"', 'SELECT')
               OR has_table_privilege('authenticated', 'public."CotizacionVisita"', 'SELECT') THEN
              RAISE EXCEPTION 'anon/authenticated conservaron SELECT en CotizacionVisita';
            END IF;
            IF has_function_privilege('anon', 'public.validar_inspeccion_visita_contratada()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.validar_inspeccion_visita_contratada()', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon/authenticated conservaron EXECUTE en validar_inspeccion_visita_contratada';
            END IF;
          END
          $;
          SQL

  recorrido-aplicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/visitas_test?schema=public
      CH_VISITAS_CONTRATADAS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://visitas-test.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-not-a-real-key
      AUTH_SECRET: isolated-ci-test-only-not-a-production-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Instalar dependencias reproducibles
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generar Prisma Client para pruebas de aplicacion
        run: npx prisma generate

      - name: Agenda y zona horaria
        run: node --test tests/agenda-zona-horaria.test.cjs

      - name: Primera revision y conceptos
        run: |
          node --test tests/visitas-primera-revision.test.cjs
          node --test tests/recorrido-conceptos.test.cjs
          node --test tests/descripcion-unica-concepto.test.cjs

      - name: Revision y autorizacion
        run: |
          node --test tests/flujo-autorizacion-vigente.test.cjs
          node --test tests/revision-recorrido-vigente.test.cjs
          node --test tests/solicitar-autorizacion-reporte.test.cjs

      - name: Compilacion final
        run: |
          npx prisma generate
          npm run build

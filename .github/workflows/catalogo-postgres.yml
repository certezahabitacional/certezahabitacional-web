name: Catalogo - PostgreSQL aislado
on:
  push:
    branches: ['codex/recorrido-catalogo-confirmado-20261019']
    paths: ['tests/catalogo-postgres.cjs', 'sql/revision-manual/catalogo-confirmado-compatible.sql', '.github/workflows/catalogo-postgres.yml']
  pull_request:
    paths: ['lib/*plan*.ts', 'tests/catalogo-postgres.cjs', 'sql/revision-manual/catalogo-confirmado-compatible.sql']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: catalogo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated SQL test runner without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/catalogo-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3 typescript@5.9.3
      - name: Test real PostgreSQL transactions and closure with synthetic records
        env:
          CATALOGO_TEST_DATABASE_URL: postgresql://postgres:isolated_ci_only@127.0.0.1:5432/catalogo_test
        run: NODE_PATH="$RUNNER_TEMP/catalogo-pg/node_modules" node tests/catalogo-postgres.cjs

name: Verify approved portfolio once
on:
  push:
    branches: [fix/imagen-original-verificada-20261019]
    paths: [.github/workflows/restore-approved-portfolio-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'certezahabitacional/certezahabitacional-web' && github.ref == 'refs/heads/fix/imagen-original-verificada-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install isolated browser test tools
        run: |
          python -m venv "$RUNNER_TEMP/portfolio-browser"
          "$RUNNER_TEMP/portfolio-browser/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/portfolio-browser/bin/python" -m playwright install --with-deps chromium
      - name: Verify exact PNG and responsive rendering
        env:
          TEST_URL: https://certezahabitacional-25z0r8hry-certeza-habitacional.vercel.app/certeza-tecnica
        run: |
          "$RUNNER_TEMP/portfolio-browser/bin/python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          output=Path('portfolio-verification');output.mkdir(exist_ok=True)
          expected='e54c82b12e1321d361853ee0adcc9fbcca698f88537d626246e2d2531add4d99'
          report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for label,width,height in [('desktop',1366,768),('tablet',768,1024),('mobile',390,844)]:
                  context=browser.new_context(viewport={'width':width,'height':height},device_scale_factor=1)
                  page=context.new_page()
                  response=page.goto(os.environ['TEST_URL'],wait_until='domcontentloaded',timeout=60000)
                  assert response and response.status==200, f'Page HTTP {response.status if response else None}'
                  image=page.locator('img[src*="portafolio-servicios-certeza-tecnica"]')
                  image.wait_for(state='visible',timeout=30000)
                  image.evaluate('(img) => img.decode()')
                  src=image.evaluate('(img) => img.currentSrc')
                  asset=context.request.get(src,timeout=60000)
                  assert asset.status==200, f'Image HTTP {asset.status}'
                  raw=asset.body()
                  assert len(raw)==2115560 and hashlib.sha256(raw).hexdigest()==expected, 'Image differs from approved file'
                  dims=image.evaluate('(img) => ({width:img.naturalWidth,height:img.naturalHeight,complete:img.complete})')
                  assert dims=={'width':1254,'height':1254,'complete':True}, dims
                  box=image.bounding_box()
                  assert box and box['width']>300 and abs(box['width']-box['height'])<1, box
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), 'Horizontal overflow'
                  cropped=image.evaluate('''(img) => {
                    const r=img.getBoundingClientRect(); const found=[];
                    for(let a=img.parentElement;a;a=a.parentElement){
                      const s=getComputedStyle(a),b=a.getBoundingClientRect();
                      if(['hidden','clip'].includes(s.overflowY) && (r.top<b.top-1 || r.bottom>b.bottom+1)) found.push(a.tagName);
                    }
                    return found;
                  }''')
                  assert not cropped, f'Clipped by {cropped}'
                  page.screenshot(path=str(output/f'{label}.png'),full_page=True)
                  if label=='desktop': (output/'approved-source.png').write_bytes(raw)
                  report.append({'viewport':label,'http':response.status,'image_sha256':expected,'natural_size':dims,'rendered_box':box,'cropped_by':cropped})
                  context.close()
              browser.close()
          (output/'report.json').write_text(json.dumps(report,indent=2))
          print('PASS: exact approved PNG, full decoding, square proportional layout, no clipping or horizontal overflow on desktop, tablet and mobile.')
          print(json.dumps(report))
          PY
      - name: Preserve visual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-portfolio-verification
          path: portfolio-verification/
          retention-days: 2
          if-no-files-found: warn

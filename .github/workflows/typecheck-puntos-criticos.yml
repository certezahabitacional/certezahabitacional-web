name: Typecheck puntos criticos
on:
  push:
    branches:
      - feature/puntos-criticos-equipo-v1
      - fix/mapeo-equipo-areas-v1
      - fix/camara-galeria-puntos-criticos
      - fix/camara-webcam-puntos-criticos
      - fix/ocultar-enlaces-inspeccion
      - fix/continuar-flujo-v1
      - fix/continuar-desde-lista-v1
      - fix/acciones-visibles-inspecciones
      - fix/folio-directo-flujo-v1
      - fix/previsualizacion-fotos-puntos-criticos
      - fix/regla-galeria-manometro-v1
      - fix/feedback-ia-puntos-criticos
      - fix/manometros-y-avance-puntos-criticos
      - fix/continuidad-manometro-puntos-criticos
      - fix/conservar-foco-concepto-puntos-criticos
      - fix/foco-persistente-session
      - fix/foco-acciones-reales-puntos-criticos
      - fix/cierre-puntos-criticos-resultado-valido
      - feature/no-aplica-concepto-manual-puntos-criticos
      - fix/pre-reporte-punto4-cotizacion
      - fix/pre-reporte-punto4-definitivo
      - fix/partidas-1-8-recorrido-reporte
      - fix/recorrido-27-partidas

      - feature/flujo-autorizacion-v1-bloque-a

      - feature/integracion-cierre-reporte-v1

      - fix/flujo-inspector-6-pasos-partidas-consecutivas

      - fix/navegacion-compacta-pre-reporte-v1

      - fix/congruencia-27-partidas-reporte-paginacion

      - fix/firmas-qr-resumen-paginacion-v1

      - fix/cierre-v1-congruencia-formato-reporte

      - fix/paginacion-real-reporte-v1

      - fix/carga-fotos-movil-413

      - fix/integra-flujo-pre-reporte-pr97

      - fix/navegacion-partidas-hermeticidad

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
